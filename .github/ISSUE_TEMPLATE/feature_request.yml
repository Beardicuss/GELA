name: Feature request
description: Propose a focused GELA improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, and resource impact
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Recognition, Windows control, User interface, Packaging, micro:bit or hardware, Documentation, Other]
    validations:
      required: true
